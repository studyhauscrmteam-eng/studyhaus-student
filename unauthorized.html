<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <title>Unauthorized Access — Studyhaus CRM</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg);
      text-align: center;
    }

    .unauth-container {
      max-width: 400px;
      margin: 2rem;
    }

    .icon {
      font-size: 4rem;
      margin-bottom: 1rem;
    }
  </style>
</head>

<body class="light-mode">
  <div class="icon"
    style="color:var(--accent-red, #ef4444); display:flex; justify-content:center; margin-bottom:1.5rem;">
    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
      <line x1="12" y1="8" x2="12" y2="12" />
      <line x1="12" y1="16" x2="12.01" y2="16" />
    </svg>
  </div>
  <h1 style="color: var(--text-dark); margin-bottom: 0.5rem;">Access Denied</h1>
  <p style="color: var(--text-light); margin-bottom: 2rem;">You do not have permission to view this page based on your
    current role.</p>
  <button id="go-back-btn" class="btn btn-primary">Return to Dashboard</button>
  </div>

  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"
      }
    }
  </script>

  <script type="module">
    import { initAuthGuard } from "./auth/guard.js";
    import { getRedirectUrlForRole } from "./auth/login.js";

    // Initializes guard (will redirect to login if not logged in at all)
    initAuthGuard();

    document.getElementById("go-back-btn").addEventListener("click", () => {
      const role = localStorage.getItem("userRole");
      if (role) {
        window.location.href = getRedirectUrlForRole(role);
      } else {
        window.location.href = "/login.html";
      }
    });
  </script>
</body>

</html>
