<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <title>Create Account — Studyhaus</title>
  <!-- Compat shim: sign-in + sign-up now live on ONE page (/login.html with
       tabs). Old bookmarks and website links pointing here land on the
       Create account tab, with any ?query / #prefill preserved. -->
  <meta http-equiv="refresh" content="0;url=/login.html?tab=signup" />
</head>
<body>
  <p style="font-family:system-ui,sans-serif;text-align:center;margin-top:3rem;color:#64748b;">
    Taking you to <a href="/login.html?tab=signup">Create account…</a>
  </p>
  <script>
    (function () {
      var search = window.location.search || "";
      var hash = window.location.hash || "";
      var target = "/login.html";
      // Force the signup tab, keeping any other params (e.g. ?registered=1).
      if (/[?&]tab=/.test(search)) {
        target += search.replace(/([?&])tab=[^&]*/g, "$1tab=signup").replace(/&&+/g, "&");
      } else if (search) {
        target += search + "&tab=signup";
      } else {
        target += "?tab=signup";
      }
      target += hash;
      window.location.replace(target);
    })();
  </script>
</body>
</html>
