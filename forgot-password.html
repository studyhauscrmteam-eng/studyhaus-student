<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <title>Forgot Password — Studyhaus CRM</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg); }
    .login-container { max-width: 400px; width: 100%; margin: 2rem; }
    .login-logo { text-align: center; margin-bottom: 2rem; }
    .login-logo .logo-icon { width: 48px; height: 48px; font-size: 24px; margin: 0 auto 1rem; display: flex; align-items: center; justify-content: center; }
    .login-logo .logo-text { font-size: 1.5rem; font-weight: 700; color: var(--text-dark); }
  </style>
</head>
<body class="light-mode">
  <div class="login-container">
    <div class="login-logo">
      <div class="logo-icon">S</div>
      <div class="logo-text">Studyhaus</div>
    </div>
    <div class="card">
      <h2 style="margin-bottom: 1rem; color: var(--text-dark);">Reset Password</h2>
      <p style="font-size: 13.5px; color: var(--text-light); margin-bottom: 1.5rem;">Enter your email address and we'll send you a link to reset your password.</p>
      
      <form id="reset-form">
        <div class="form-group full-width">
          <label>Email Address</label>
          <input type="email" id="email" required placeholder="admin@studyhaus.com" />
        </div>
        
        <div id="message" style="font-size: 13px; margin-bottom: 1rem; display: none;"></div>
        
        <button type="submit" class="btn btn-primary" id="submit-btn" style="width: 100%; margin-bottom: 1rem;">Send Reset Link</button>
        <div style="text-align: center; font-size: 13.5px;">
          <a href="login.html" style="color: var(--primary); text-decoration: none;">&larr; Back to Login</a>
        </div>
      </form>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"
      }
    }
  </script>
  
  <script type="module">
    import { initAuthGuard } from "./auth/guard.js";
    import { resetPassword } from "./services/authService.js";

    // Will redirect to dashboard if already logged in
    initAuthGuard();

    const form = document.getElementById("reset-form");
    const msgDiv = document.getElementById("message");
    const btn = document.getElementById("submit-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msgDiv.style.display = "none";
      btn.textContent = "Sending...";
      btn.disabled = true;

      const email = document.getElementById("email").value;

      try {
        await resetPassword(email);
        msgDiv.textContent = "Password reset email sent! Check your inbox.";
        msgDiv.style.color = "var(--success)";
        msgDiv.style.display = "block";
        btn.textContent = "Send Reset Link";
        btn.disabled = false;
      } catch (error) {
        msgDiv.textContent = error.message;
        msgDiv.style.color = "var(--danger)";
        msgDiv.style.display = "block";
        btn.textContent = "Send Reset Link";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
