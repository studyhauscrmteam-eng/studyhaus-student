<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#983132" />
  <title>Shreeji Reading Library — Student Portal</title>
  <script>
    (function() {
      try {
        var uid = localStorage.getItem("userId");
        var role = localStorage.getItem("userRole");
        if (uid && role === "Student") {
          window.location.replace("student/dashboard.html");
          return;
        }
      } catch (e) {}
      window.location.replace("login.html");
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Vadodara:wght@400;500;600;700&family=Noto+Sans+Gujarati:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body style="font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f8fafc;">
  <p style="color: #64748b;">Opening Shreeji Reading Library...</p>
</body>
</html>
